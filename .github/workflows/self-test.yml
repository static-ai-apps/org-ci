# Run the detectors against the fixtures whenever CI's own code changes.
name: self-test

on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "config/**", ".github/workflows/self-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pyyaml psutil playwright
          python -m playwright install --with-deps chromium
      - run: python tests/run_fixtures.py
