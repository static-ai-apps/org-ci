# Weekly: re-apply repo settings. Monthly: a heartbeat commit, because GitHub disables
# scheduled workflows in public repos after 60 days without activity.
name: housekeeping

on:
  schedule:
    - cron: "23 7 * * 1"
    - cron: "5 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 7 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - run: python scripts/enforce_settings.py
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}

  heartbeat:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 8 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > HEARTBEAT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HEARTBEAT
          git commit -m "Heartbeat"
          git push
